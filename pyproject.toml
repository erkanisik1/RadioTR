[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radiotr"
version = "0.3.0"
description = "İnternet radyo oynatıcısı (PyQt6 + VLC + SQLite) - gerçek zamanlı VU metre"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Erkan Işık" }]
keywords = ["radio", "internet radio", "vlc", "pyqt6", "pulseaudio"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PyQt6>=6.0.0",
    "python-vlc>=3.0.0",
    "PyAudio>=0.2.11",
    "numpy>=1.20",
]

[project.scripts]
radiotr = "radiotr.app:main"

[tool.setuptools]
packages = ["radiotr"]

[tool.setuptools.package-data]
radiotr = ["lang/*.json", "icons/*.png", "style.qss"]